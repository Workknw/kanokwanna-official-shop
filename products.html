<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNWT Management System | All-in-One Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #004d2a; --accent: #006738; --danger: #d32f2f;
            --warning: #f57c00; --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21;
            --shipped: #e3f2fd; --completed: #f3e5f5;
        }
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: none; }
        
        /* Glassmorphism Header & Tabs */
        .header-nav { max-width: 1200px; margin: 0 auto 30px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 10px; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.3); }
        .tab-nav { display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer; background: transparent; font-weight: 600; transition: 0.3s; color: #666; display: flex; align-items: center; gap: 8px; }
        .tab-btn i { font-size: 18px; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0,77,42,0.3); }

        /* Container & Layout */
        .main-content { max-width: 1200px; margin: 0 auto; }
        .admin-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; margin-bottom: 40px; }
        .glass-card { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; }
        
        /* Form Elements */
        h2 { margin: 0 0 20px; color: var(--primary); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--accent); }
        input, select, textarea { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; transition: 0.2s; background: #fcfcfc; }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(0,77,42,0.05); }
        
        .row { display: flex; gap: 15px; }
        .row > div { flex: 1; }
        
        /* Image Upload */
        .upload-area { border: 2px dashed #ccc; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; background: #f9f9f9; margin-bottom: 15px; }
        .upload-area:hover { border-color: var(--primary); background: #f0f7f4; }
        .thumb-list { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .thumb-wrapper { position: relative; width: 70px; height: 85px; }
        .thumb-item { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .btn-remove-img { position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; font-size: 12px; }

        /* Preview Card (iOS Style) */
        .preview-sticky { position: sticky; top: 100px; }
        .preview-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid #eee; text-align: left; }
        .image-preview-container { width: 100%; height: 350px; background: #f0f0f0; position: relative; display: flex; align-items: center; justify-content: center; }
        #preview-img-tag { width: 100%; height: 100%; object-fit: cover; }
        .badge-best { position: absolute; top: 15px; right: 15px; background: #ffc107; color: #000; padding: 5px 12px; border-radius: 10px; font-weight: bold; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Order & Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 18px; text-align: center; border-bottom: 4px solid #eee; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h4 { margin: 0; font-size: 13px; color: #777; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 28px; font-weight: 800; color: var(--primary); font-family: 'Plus Jakarta Sans'; }

        /* Product List Styles */
        .product-item { background: white; padding: 15px; margin-bottom: 12px; border-radius: 15px; display: flex; align-items: center; border: 1px solid #eee; transition: 0.2s; }
        .product-item:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-active { background: #e8f5e9; color: #2e7d32; }
        .status-hidden { background: #f5f5f5; color: #757575; }

        /* Order Card */
        .order-card { background: white; padding: 25px; border-radius: 18px; margin-bottom: 20px; border-left: 6px solid #ddd; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .order-pending { border-left-color: #f59e0b; }
        .order-shipped { border-left-color: #10b981; }

        /* Bulk Bar */
        .bulk-bar { background: var(--primary); color: white; padding: 15px 25px; border-radius: 15px; margin-bottom: 20px; display: none; justify-content: space-between; align-items: center; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Button styles */
        .btn-main { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: var(--accent); transform: scale(1.02); }
        .btn-ghost { background: #eee; color: #333; padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-nav">
    <div style="font-family:'Plus Jakarta Sans'; font-weight:800; color:var(--primary); font-size:20px;">KNWT ADMIN</div>
    <div class="tab-nav">
        <button onclick="switchTab('products')" class="tab-btn active" id="tab-p"><i class="fas fa-box"></i> สินค้า</button>
        <button onclick="switchTab('orders')" class="tab-btn" id="tab-o"><i class="fas fa-file-invoice"></i> ออเดอร์ <span id="badge-order-count" style="background:red; color:white; font-size:10px; padding:2px 6px; border-radius:10px; display:none;">0</span></button>
    </div>
    <button onclick="exportData()" class="btn-ghost" style="font-size: 13px;"><i class="fas fa-download"></i> Backup</button>
</div>

<div class="main-content">
    
    <!-- 📦 PRODUCT TAB -->
    <div id="product-page">
        <div class="stats-grid">
            <div class="stat-card" style="border-bottom-color: var(--primary);">
                <h4>📦 สินค้าทั้งหมด</h4><p id="stat-total">0</p>
            </div>
            <div class="stat-card" style="border-bottom-color: var(--danger);">
                <h4>⚠️ สต็อกต่ำกว่า 5</h4><p id="stat-low">0</p>
            </div>
            <div class="stat-card" style="border-bottom-color: #3b82f6;">
                <h4>💰 ยอดขายรวม</h4><p id="stat-sold">0</p>
            </div>
            <div class="stat-card" style="border-bottom-color: #f59e0b;">
                <h4>✨ สินค้าขายดี</h4><p id="stat-bestseller">0</p>
            </div>
        </div>

        <div class="admin-grid">
            <div class="form-section glass-card">
                <h2 id="form-title"><i class="fas fa-plus-circle"></i> ข้อมูลสินค้า</h2>
                <div class="row">
                    <div style="flex: 2;">
                        <label>ชื่อสินค้า</label>
                        <input id="name" placeholder="ระบุชื่อสินค้า..." oninput="updatePreview()">
                    </div>
                    <div>
                        <label>หมวดหมู่</label>
                        <select id="category" onchange="updatePreview()">
                            <option value="student">นักเรียน</option>
                            <option value="student">นักศึกษา</option>
                            <option value="government officer">ข้าราชการ</option>
                            <option value="shoe">รองเท้า</option>
                            <option value="General">ทั่วไป</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label>ราคาป้าย (บาท)</label>
                        <input id="price" type="number" placeholder="0" oninput="updatePreview()">
                    </div>
                    <div>
                        <label>ราคาลด (Sale Price)</label>
                        <input id="salePrice" type="number" placeholder="ถ้ามี" oninput="updatePreview()">
                    </div>
                </div>

                <div style="display:flex; gap:20px; background:#f9f9f9; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #eee;">
                    <label style="margin:0; cursor:pointer;"><input type="checkbox" id="isSale" onchange="updatePreview()">🔥 เปิด/ปิด ลดราคา Sale</label>
                    <label style="margin:0; cursor:pointer;"><input type="checkbox" id="isBestSeller" onchange="updatePreview()"> ✨ สินค้าขายดี Best Seller</label>
                </div>

                <div class="row">
                    <div><label>คงเหลือในสต็อก</label><input id="stock" type="number" value="0"></div>
                    <div><label>ยอดขายสะสม</label><input id="sold" type="number" value="0"></div>
                </div>

                <label>รายละเอียด</label>
                <textarea id="desc" rows="3" placeholder="ข้อมูลเนื้อผ้า, ไซส์..." oninput="updatePreview()"></textarea>

                <label>อัปโหลดรูปภาพ</label>
                <div class="upload-area" id="drop-zone">
                    <i class="fas fa-cloud-upload-alt" style="font-size:30px; color:var(--primary); margin-bottom:10px;"></i>
                    <p style="margin:0; font-size:14px;">คลิก หรือ ลากไฟล์รูปภาพมาวาง</p>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                </div>
                <div id="thumb-container" class="thumb-list"></div>

                <label>ไซส์ที่เปิดขาย (เช่น S, M, L)</label>
                <input id="sizes" placeholder="S:199, M:299, L:399, XL:499" oninput="updatePreview()">

                <div style="display:flex; gap:10px;">
                    <button id="main-btn" class="btn-main" onclick="handleSave()">บันทึกข้อมูลสินค้า</button>
                    <button id="cancel-btn" class="btn-ghost" style="display:none;" onclick="resetForm()">ยกเลิก</button>
                </div>
            </div>

            <div class="preview-section">
                <div class="preview-sticky">
                    <p style="font-size: 11px; font-weight: 800; color: #999; margin-bottom: 10px; letter-spacing: 1px;">PREVIEW ON APP</p>
                    <div class="preview-card">
                        <div id="badge-best" class="badge-best" style="display:none;">BEST SELLER</div>
                        <div class="image-preview-container">
                            <img id="preview-img-tag" src="https://via.placeholder.com/400x500?text=KNWT+Shop">
                            <div id="img-count" style="display:none; position:absolute; bottom:15px; right:15px; background:rgba(0,0,0,0.6); color:white; padding:4px 12px; border-radius:20px; font-size:11px;">+0 images</div>
                        </div>
                        <div style="padding:25px;">
                            <p id="preview-name" style="margin:0; font-weight:800; font-size:22px; color:var(--primary);">ชื่อสินค้า</p>
                            <div id="price-area" style="margin-top:5px;"></div>
                            <div id="preview-sizes-list" style="margin-top:10px; display:flex; gap:5px;"></div>
                            <p id="preview-desc" style="font-size:13px; color:#666; margin-top:15px; white-space:pre-line; line-height:1.6;"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- List Section -->
        <div class="glass-card">
            <div id="bulk-bar" class="bulk-bar">
                <span id="bulk-count" style="font-weight:700;">เลือกแล้ว 0 รายการ</span>
                <div style="display: flex; gap: 10px;">
                    <button onclick="bulkStatus('active')" class="btn-ghost" style="background:#fff; color:var(--primary)">เปิดขาย</button>
                    <button onclick="bulkStatus('inactive')" class="btn-ghost" style="background:rgba(255,255,255,0.2); color:white; border:1px solid white;">ซ่อน</button>
                    <button onclick="bulkDelete()" class="btn-ghost" style="background:#ff4444; color:white;">ลบทิ้ง</button>
                    <button onclick="clearSelection()" class="btn-ghost">ยกเลิก</button>
                </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0;">📦 รายการสินค้าทั้งหมด</h3>
                <input id="searchBox" placeholder="ค้นหาชื่อสินค้า..." oninput="renderProducts()" style="width:250px; margin:0;">
            </div>
            <div id="productList"></div>
        </div>
    </div>

    <!-- 🧾 ORDER TAB -->
    <div id="order-page" style="display:none;">
        <div class="stats-grid">
            <div class="stat-card" style="border-bottom-color: #f59e0b;">
                <h4>🚚 คำสั่งซื้อที่รอดำเนินการ</h4><p id="stat-pending">0</p>
            </div>
            <div class="stat-card" style="border-bottom-color: #10b981;">
                <h4>✅ จัดส่งแล้ว</h4><p id="stat-shipped-count">0</p>
            </div>
        </div>
        <div id="orderList"></div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, where, orderBy, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDToPawKXOwr1zIoYuU-h8OvBrwwoM_pXE",
        authDomain: "kanokwan-shop-edcf3.firebaseapp.com",
        projectId: "kanokwan-shop-edcf3",
        storageBucket: "kanokwan-shop-edcf3.firebasestorage.app",
        messagingSenderId: "565108045695",
        appId: "1:565108045695:web:7a16c9ee14f01d48f7cc4a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let editDocId = null;
    let imageList = []; 
    let productsLocal = [];
    let selectedIds = new Set();

    // --- 🔄 Tab Logic ---
    window.switchTab = (tab) => {
        const isP = tab === 'products';
        document.getElementById('product-page').style.display = isP ? 'block' : 'none';
        document.getElementById('order-page').style.display = isP ? 'none' : 'block';
        document.getElementById('tab-p').classList.toggle('active', isP);
        document.getElementById('tab-o').classList.toggle('active', !isP);
        if(!isP) listenOrders();
    };

    // --- 📦 Product Logic ---
    function listenProducts() {
    const q = query(collection(db, "products"), orderBy("updatedAt", "desc"));

    onSnapshot(q, (snap) => {
        productsLocal = snap.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
        }));

        updateStats();
        renderProducts();
    });
}

    function updateStats() {
        document.getElementById('stat-total').innerText = productsLocal.length;
        document.getElementById('stat-low').innerText = productsLocal.filter(p => p.stock < 5).length;
        document.getElementById('stat-sold').innerText = productsLocal.reduce((acc, p) => acc + (Number(p.sold) || 0), 0);
        document.getElementById('stat-bestseller').innerText = productsLocal.filter(p => p.isBestSeller).length;
    }

    function renderProducts() {
        const list = document.getElementById('productList');
        const kw = document.getElementById('searchBox').value.toLowerCase();
        let filtered = productsLocal.filter(p => p.name.toLowerCase().includes(kw));
        
        list.innerHTML = filtered.map(p => {
            const isChecked = selectedIds.has(p.id) ? 'checked' : '';
            return `
                <div class="product-item">
                    <input type="checkbox" onchange="toggleSelect('${p.id}')" ${isChecked} style="width:20px; height:20px; margin-right:15px;">
                    <img src="${p.img || 'https://via.placeholder.com/50'}" style="width:60px; height:60px; object-fit:cover; border-radius:10px; margin-right:15px;">
                    <div style="flex:1">
                        <div style="font-weight:700; color:var(--primary);">${p.name} <span class="status-badge ${p.status === 'active' ? 'status-active' : 'status-hidden'}">${p.status}</span></div>
                        <div style="font-size:12px; color:#777; margin-top:3px;">
                            ฿${p.price.toLocaleString()} | คลัง: <b style="${p.stock < 5 ? 'color:red' : ''}">${p.stock}</b> | ขายแล้ว: ${p.sold}
                        </div>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-ghost" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-ghost" style="color:red;" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
        }).join('');
    }

    // --- 🧾 Order Logic (Real-time Sync) ---
    function listenOrders() {
    onSnapshot(
        query(
            collection(db, "orders"),
            where("status", "==", "pending"),
            orderBy("createdAt", "desc")
        ),
        (snap) => {
            const orders = snap.docs.map(d => ({id: d.id, ...d.data()}));
            let p = 0, s = 0;
            document.getElementById('orderList').innerHTML = orders.map(o => {
                const statusLabel = o.status === 'pending' ? 'รอดำเนินการ' : 'จัดส่งแล้ว';
                if(o.status === 'pending') p++; else s++;
                return `
                    <div class="order-card order-${o.status}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <span class="status-badge ${o.status === 'pending' ? 'status-active' : 'status-hidden'}" style="background:#eee; color:#333; margin-bottom:10px; display:inline-block;">${statusLabel}</span>
                                <div style="font-weight:800; font-size:18px;">Order #${o.id.slice(-6).toUpperCase()}</div>
                                <div style="color:#666; font-size:13px; margin-bottom:15px;">${new Date(o.createdAt).toLocaleString('th-TH')}</div>
                                
                                <div style="background:#fcfcfc; border:1px solid #eee; padding:15px; border-radius:12px;">
                                    <div style="font-weight:700; margin-bottom:8px;"><i class="fas fa-user"></i> ${o.customerName}</div>
                                    <div style="font-size:13px; color:#555;"><i class="fas fa-phone"></i> ${o.customerPhone}</div>
                                    <div style="font-size:13px; color:#555; margin-top:5px;"><i class="fas fa-map-marker-alt"></i> ${o.address || 'ไม่ได้ระบุ'}</div>
                                    <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
                                    ${o.items.map(i => `<div style="font-size:14px; display:flex; justify-content:space-between;"><span>${i.name} (${i.size}) x ${i.qty}</span> <b>฿${(i.price * i.qty).toLocaleString()}</b></div>`).join('')}
                                    <div style="text-align:right; margin-top:10px; font-weight:800; color:var(--primary); font-size:18px;">รวมทั้งสิ้น: ฿${o.totalAmount.toLocaleString()}</div>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                ${o.status === 'pending' ? `
    <button onclick="approveOrder('${o.id}')" class="btn-main" style="width:auto; padding:10px 15px;">ยืนยัน</button>
    <button onclick="rejectOrder('${o.id}')" class="btn-ghost" style="color:red;">ปฏิเสธ</button>
` : `<div style="color:#10b981; font-weight:800;">ส่งเรียบร้อย</div>`}
                            </div>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('stat-pending').innerText = p;
            document.getElementById('stat-shipped-count').innerText = s;
            document.getElementById('badge-order-count').innerText = p;
            document.getElementById('badge-order-count').style.display = p > 0 ? 'inline' : 'none';
        });
    }

    window.approveOrder = async (orderId) => {
        const res = await Swal.fire({ title: 'ยืนยันรายการส่งสินค้า?', text: "ระบบจะทำการตัดยอดสต็อกสินค้าทันที", icon: 'question', showCancelButton: true, confirmButtonColor: '#004d2a' });
        if(res.isConfirmed) {
            try {
                await runTransaction(db, async (transaction) => {
                    const orderRef = doc(db, "orders", orderId);
                    const orderData = (await transaction.get(orderRef)).data();
                    if (orderData.status !== 'pending') throw "ออเดอร์นี้ถูกดำเนินการไปแล้ว";
                    
                    for (const item of orderData.items) {
                        const pRef = doc(db, "products", item.productId);
                        const pSnap = await transaction.get(pRef);
                        if (pSnap.exists()) {
                            const currentStock = pSnap.data().stock || 0;
                            const currentSold = pSnap.data().sold || 0;
                            if (currentStock < item.qty) throw `สินค้า ${item.name} สต็อกไม่พอ!`;
                            transaction.update(pRef, { 
                                stock: currentStock - item.qty,
                                sold: currentSold + item.qty 
                            });
                        }
                    }
                    transaction.update(orderRef, { status: 'shipped', updatedAt: Date.now() });
                });
                Swal.fire('สำเร็จ', 'ดำเนินการเรียบร้อยแล้ว', 'success');
            } catch (e) { Swal.fire('ผิดพลาด', e, 'error'); }
        }
    };

    window.rejectOrder = async (orderId) => {
    const res = await Swal.fire({
        title: 'ปฏิเสธออเดอร์?',
        text: "ออเดอร์นี้จะถูกยกเลิก",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d32f2f'
    });

    if(res.isConfirmed) {
        try {
            await updateDoc(doc(db, "orders", orderId), {
                status: "cancelled",
                updatedAt: Date.now()
            });

            Swal.fire('สำเร็จ', 'ยกเลิกออเดอร์แล้ว', 'success');
        } catch (e) {
            Swal.fire('ผิดพลาด', e, 'error');
        }
    }
};

    // --- 🛠 Helpers & UI ---
    window.toggleSelect = (id) => {
        selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
        const bar = document.getElementById('bulk-bar');
        bar.style.display = selectedIds.size > 0 ? 'flex' : 'none';
        document.getElementById('bulk-count').innerText = `เลือกแล้ว ${selectedIds.size} รายการ`;
        renderProducts();
    };

    window.clearSelection = () => { selectedIds.clear(); document.getElementById('bulk-bar').style.display = 'none'; renderProducts(); };
    
    window.bulkStatus = async (s) => {
        const b = writeBatch(db);
        selectedIds.forEach(id => b.update(doc(db, "products", id), {status: s, updatedAt: Date.now()}));
        await b.commit();
        clearSelection();
        Swal.fire('สำเร็จ', 'อัปเดตสถานะกลุ่มแล้ว', 'success');
    };

    window.bulkDelete = async () => {
        if(confirm(`ยืนยันลบ ${selectedIds.size} รายการ?`)) {
            const b = writeBatch(db);
            selectedIds.forEach(id => b.delete(doc(db, "products", id)));
            await b.commit();
            clearSelection();
        }
    };

    // --- Image Handling ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('fileInput');
    dropZone.onclick = () => fileInput.click();
    dropZone.ondrop = (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); };
    fileInput.onchange = (e) => handleFiles(e.target.files);
    dropZone.ondragover = (e) => e.preventDefault();

    function handleFiles(files) {
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if(w > 800) { h *= 800/w; w = 800; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    imageList.push(canvas.toDataURL('image/jpeg', 0.7));
                    renderThumbs(); updatePreview();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    window.renderThumbs = () => {
        document.getElementById('thumb-container').innerHTML = imageList.map((img, i) => `
            <div class="thumb-wrapper">
                <img src="${img}" class="thumb-item">
                <div class="btn-remove-img" onclick="removeImage(${i})">×</div>
            </div>`).join('');
    };

    window.removeImage = (i) => { imageList.splice(i, 1); renderThumbs(); updatePreview(); };

    window.updatePreview = () => {
        const name = document.getElementById('name').value || "ชื่อสินค้า";
        const p = Number(document.getElementById('price').value) || 0;
        const sp = Number(document.getElementById('salePrice').value) || 0;
        const isS = document.getElementById('isSale').checked;
        const sizesArr = document.getElementById('sizes').value.split(',').filter(s => s.trim() !== "");

        document.getElementById('preview-name').innerText = name;
        document.getElementById('badge-best').style.display = document.getElementById('isBestSeller').checked ? 'block' : 'none';
        document.getElementById('preview-img-tag').src = imageList[0] || "https://via.placeholder.com/400x500?text=KNWT+Shop";
        document.getElementById('img-count').innerText = `+${imageList.length - 1} images`;
        document.getElementById('img-count').style.display = imageList.length > 1 ? 'block' : 'none';
        
        document.getElementById('price-area').innerHTML = (isS && sp > 0) 
            ? `<span style="text-decoration:line-through;color:#999;font-size:14px;">฿${p.toLocaleString()}</span> <span style="color:var(--danger);font-weight:800;font-size:24px">฿${sp.toLocaleString()}</span>` 
            : `<span style="color:var(--primary);font-weight:800;font-size:24px">฿${p.toLocaleString()}</span>`;
        
        document.getElementById('preview-desc').innerText = document.getElementById('desc').value || "รายละเอียดสินค้าจะแสดงตรงนี้...";
        document.getElementById('preview-sizes-list').innerHTML = sizesArr.map(s => `<span style="border:1px solid #ddd; padding:2px 8px; border-radius:5px; font-size:11px;">${s.trim()}</span>`).join('');
    };

    window.handleSave = async () => {
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        if(!name || !price) return Swal.fire('แจ้งเตือน', 'กรุณากรอกชื่อและราคา', 'warning');

        const btn = document.getElementById('main-btn');
        btn.disabled = true; btn.innerText = "กำลังบันทึก...";

        const payload = {
            name, price: Number(price),
            salePrice: Number(document.getElementById('salePrice').value) || 0,
            isSale: document.getElementById('isSale').checked,
            isBestSeller: document.getElementById('isBestSeller').checked,
            stock: Number(document.getElementById('stock').value) || 0,
            sold: Number(document.getElementById('sold').value) || 0,
            description: document.getElementById('desc').value,
            category: document.getElementById('category').value,
            status: document.getElementById('status')?.value || 'active',
            sizes: document.getElementById('sizes').value
              .split(',')
              .map(s => {
                const [size, price] = s.split(':');
                return {
                  size: size.trim(),
                  price: Number(price) || 0
                };
              })
              .filter(s => s.size),
            img: imageList[0] || "",
            images: imageList,
            updatedAt: Date.now()
        };

        try {
            if(editDocId) await updateDoc(doc(db, "products", editDocId), payload);
            else { payload.createdAt = Date.now(); await addDoc(collection(db, "products"), payload); }
            Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อย', 'success');
            resetForm();
        } catch(e) { Swal.fire('Error', e.message, 'error'); }
        finally { btn.disabled = false; btn.innerText = "บันทึกข้อมูลสินค้า"; }
    };

    window.editProduct = (id) => {
        const p = productsLocal.find(i => i.id === id);
        if(!p) return;
        editDocId = id;
        document.getElementById('name').value = p.name;
        document.getElementById('price').value = p.price;
        document.getElementById('salePrice').value = p.salePrice || '';
        document.getElementById('isSale').checked = p.isSale || false;
        document.getElementById('isBestSeller').checked = p.isBestSeller || false;
        document.getElementById('stock').value = p.stock || 0;
        document.getElementById('sold').value = p.sold || 0;
        document.getElementById('desc').value = p.description || "";
        document.getElementById('category').value = p.category || "Shirt";
        document.getElementById('sizes').value = p.sizes ? p.sizes.map(s => s.size).join(', ') : '';
        imageList = [...(p.images || [])];
        renderThumbs();
        document.getElementById('form-title').innerHTML = "<i class='fas fa-edit'></i> แก้ไขสินค้า";
        document.getElementById('main-btn').innerText = "บันทึกการแก้ไข";
        document.getElementById('cancel-btn').style.display = "inline-block";
        updatePreview();
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.deleteProduct = async (id) => {
        if(confirm("ต้องการลบสินค้านี้ใช่หรือไม่?")) await deleteDoc(doc(db, "products", id));
    };

    window.resetForm = () => {
        editDocId = null; imageList = [];
        document.querySelectorAll('input:not([type=checkbox]), textarea').forEach(i => i.value = '');
        document.getElementById('isSale').checked = false; 
        document.getElementById('isBestSeller').checked = false;
        document.getElementById('thumb-container').innerHTML = '';
        document.getElementById('form-title').innerHTML = "<i class='fas fa-plus-circle'></i> ข้อมูลสินค้า";
        document.getElementById('main-btn').innerText = "บันทึกข้อมูลสินค้า";
        document.getElementById('cancel-btn').style.display = "none";
        updatePreview();
    };

    window.exportData = () => {
        const data = JSON.stringify({products: productsLocal, exportDate: new Date()}, null, 2);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([data], {type: "application/json"}));
        a.download = `KNWT_Data_${new Date().toLocaleDateString()}.json`; a.click();
    };

    // Authentication
    const pass = prompt("Admin Password:");
    if(pass === "1234") { 
        document.body.style.display = "block"; 
        listenProducts(); 
        listenOrders(); // โหลดทั้งสองอย่างรอไว้เลย
    } else { 
        document.body.innerHTML = "<div style='text-align:center; margin-top:100px;'><h1>❌ Access Denied</h1></div>"; 
        document.body.style.display = "block"; 
    }
</script>

</body>
</html>
